[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    ui: UI tests
    api: API tests
    smoke: Smoke tests
    regression: Regression tests
addopts =
    --strict-markers
    --tb=short
    -v
    --alluredir=allure-results
    --reruns=1
    --reruns-delay=2